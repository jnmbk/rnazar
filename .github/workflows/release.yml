name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.8.2)"
        required: false
        default: ""

permissions:
  contents: write

env:
  RNAZAR_VERSION: ${{ github.event.inputs.tag_name != '' && github.event.inputs.tag_name || github.ref_name }}

jobs:
  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev curl file

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build AppImage
        run: |
          # Download appimagetool
          mkdir -p target/appimage
          curl -fsSL -o target/appimage/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x target/appimage/appimagetool
          # Extract because FUSE might not be available in runner
          cd target/appimage
          ./appimagetool --appimage-extract
          export PATH="$PWD/squashfs-root/usr/bin:$PATH"
          cd ../..

          ./packaging/appimage/build-appimage.sh

      - name: Install packaging utilities
        run: |
          sudo apt-get install -y rpm

      - name: Build Debian Package
        run: ./packaging/debian/build-deb.sh

      - name: Build Fedora RPM Package
        run: ./packaging/fedora/build-rpm.sh

      - name: Build Arch Linux Package
        run: ./packaging/arch/build-arch.sh

      - name: Upload Linux Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RNAZAR_VERSION }}
          files: |
            target/appimage/*.AppImage
            target/debian/*.deb
            target/fedora/*.rpm
            target/arch/*.pkg.tar.zst

  build-windows-setup:
    name: Build Windows Inno Setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Compile Inno Setup Installer
        run: |
          $ver = "${{ env.RNAZAR_VERSION }}".TrimStart('v')
          iscc "/DMyAppVersion=$ver" packaging\windows\setup.iss

      - name: Upload Windows Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RNAZAR_VERSION }}
          files: target/windows-installer/*.exe

  build-macos-dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install packaging tools
        run: brew install create-dmg

      - name: Build and Package DMG
        run: ./packaging/macos/build-dmg.sh

      - name: Upload macOS Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RNAZAR_VERSION }}
          files: target/macos/*.dmg

