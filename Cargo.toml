[package]
name = "rnazar"
version = "0.1.0"
edition = "2021"
authors = ["jnmbk"]
description = "System tray evil eye ward and crash notifier"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jnmbk/rnazar"

[dependencies]
muda = "0.21"
tao = "0.34"
notify-rust = "4.18"
sys-locale = "0.3"
gettext = "0.4"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6.0"
interprocess = "2.4"
rfd = "0.15"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
zbus = { version = "5.19", default-features = false, features = ["blocking-api"] }
gtk = "0.18"
gdk-pixbuf = "0.18"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[build-dependencies]
# Standard build-deps

