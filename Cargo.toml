[package]
name = "rnazar"
version = "0.8.2"
edition = "2021"
authors = ["jnmbk"]
description = "System tray evil eye ward and crash notifier"
license = "MIT"
repository = "https://github.com/jnmbk/rnazar"

[dependencies]
muda = "0.21"
tao = "0.34"
notify-rust = "4.18"
sys-locale = "0.3"
gettext = "0.4"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26"
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
zbus = { version = "5.19", default-features = false, features = ["blocking-api"] }
gtk = "0.18"
gdk-pixbuf = "0.18"

[target.'cfg(windows)'.dependencies]
interprocess = "2.4"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[build-dependencies]
rspolib = "0.1.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 1
